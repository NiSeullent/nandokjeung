name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Build & push deploy branch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_URL: ${{ vars.NANDOKJEUNG_API_URL || 'https://api.example.com' }}
        run: npm run build

      - name: Add deploy metadata
        env:
          API_URL: ${{ vars.NANDOKJEUNG_API_URL || 'https://api.example.com' }}
        run: |
          cat > web/out/deploy-info.json <<EOF
          {
            "ref": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "api_url": "${API_URL}"
          }
          EOF

      - name: Deploy to deploy branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: deploy
          folder: web/out
          clean: true
          single-commit: true
          commit-message: "deploy: ${{ github.sha }}"
